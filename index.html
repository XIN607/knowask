<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知问 KnowAsk - 智能知识库问答</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #fff; padding: 16px 24px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; color: #1a1b1c; }
        .header .upload-btn { background: #4a90d9; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; border: none; }
        .chat-area { flex: 1; overflow-y: auto; padding: 24px; max-width: 800px; margin: 0 auto; width: 100%; }
        .message { margin-bottom: 16px; max-width: 80%; }
        .message.user { margin-left: auto; }
        .message .bubble { padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 15px; }
        .message.user .bubble { background: #4a90d9; color: #fff; }
        .message.ai .bubble { background: #fff; color: #1a1b1c; border: 1px solid #e0e0e0; }
        .input-area { background: #fff; padding: 16px 24px; border-top: 1px solid #e0e0e0; }
        .input-box { max-width: 800px; margin: 0 auto; display: flex; gap: 12px; }
        .input-box input { flex: 1; padding: 12px 16px; border: 1px solid #d0d0d0; border-radius: 8px; font-size: 15px; outline: none; }
        .input-box button { padding: 12px 24px; background: #4a90d9; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
        .upload-status { text-align: center; padding: 8px; font-size: 13px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <h1>知问 KnowAsk</h1>
        <input type="file" id="fileInput" style="display:none" accept=".pdf,.docx,.md,.txt">
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">上传文档</button>
    </div>
    <div class="upload-status" id="uploadStatus"></div>
    <div class="chat-area" id="chatArea"></div>
    <div class="input-box">
        <input type="text" id="questionInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')sendQuestion()">
        <button onclick="sendQuestion()">发送</button>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const input = document.getElementById('questionInput');
        const uploadInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');

        // 页面加载时显示欢迎语
        addMessage('ai', '你好！我是知问，你的智能知识库助手。请先上传文档，然后就可以向我提问了。');

        // 文件上传
        uploadInput.onchange = async function() {
            const file = uploadInput.files[0];
            if (!file) return;
            uploadStatus.textContent = '正在上传并入库: ' + file.name + ' ...';
            const formData = new FormData();
            formData.append('file', file);
            const resp = await fetch('/upload', { method: 'POST', body: formData });
            const data = await resp.json();
            uploadStatus.textContent = '✅ ' + data.message + ' (' + data.filename + ')';
        };

        // 发送问题
        async function sendQuestion() {
            const question = input.value.trim();
            if (!question) return;
            input.value = '';
            addMessage('user', question);
            const aiBubble = addMessage('ai', '');

            // SSE 流式接收
            const resp = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question })
            });
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let aiText = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const text = decoder.decode(value);
                // 解析 SSE: data: xxx\n\n
                const lines = text.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        aiText += line.slice(6);
                        aiBubble.textContent = aiText;
                        chatArea.scrollTop = chatArea.scrollHeight;
                    }
                }
            }
        }

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            div.appendChild(bubble);
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return bubble;
        }
    </script>
</body>
</html>
